<!DOCTYPE html>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#05070a;--txt:#e8edf2;--muted:#8a97a6;--dim:#5b6672;--line:rgba(255,255,255,.08);--accent:#4da3ff}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;

    -webkit-font-smoothing:antialiased}
  .grid{position:fixed;inset:0;z-index:0;opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 20%,transparent 76%);
    mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 20%,transparent 76%)}
  .w{position:relative;z-index:2;max-width:560px}
  .brand{display:flex;align-items:center;gap:11px;font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:19px;letter-spacing:.04em;margin-bottom:44px}
  .code{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;
    letter-spacing:.24em;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(30px,5vw,44px);
    line-height:1.08;letter-spacing:-.02em;margin-bottom:18px}
  p{color:var(--muted);font-size:16.5px;line-height:1.55;margin-bottom:34px;max-width:46ch}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  a.btn{font-family:'Space Grotesk',sans-serif;font-size:13.5px;letter-spacing:.04em;
    padding:11px 21px;border:1px solid rgba(255,255,255,.14);border-radius:2px;color:var(--txt);
    text-decoration:none;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
  a.btn:hover{border-color:var(--accent);color:var(--accent)}
  a.solid{background:var(--txt);color:#05070a;border-color:var(--txt)}
  a.solid:hover{background:var(--accent);border-color:var(--accent);color:#05070a}
</style>
</head>
